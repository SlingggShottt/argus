# Production equivalent of vite.config.js's dev proxy: relative /api paths
# in client.js work unchanged, just proxied by nginx instead of Vite here.
server {
    listen 80;

    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri /index.html;
    }
}

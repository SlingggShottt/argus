# Render Blueprint -- best-effort, NOT verified against the live platform
# (no way to test-deploy from an agent session). If Render's dashboard
# flags anything here as invalid on import, fix it there directly -- the
# manual step-by-step instructions in README.md's Deployment section are
# the reliable fallback and don't depend on this file being exactly right.
databases:
  - name: argus-db
    databaseName: argus
    user: argus
    plan: free

services:
  - type: web
    name: argus-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: argus-db
          property: connectionString
      - key: GROQ_API_KEY
        sync: false

  - type: web
    name: argus-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      # Backend's actual assigned URL (Render appended a random suffix
      # since "argus-backend" alone was taken).
      - type: rewrite
        source: /api/*
        destination: https://argus-backend-a4y6.onrender.com/api/*
      - type: rewrite
        source: /*
        destination: /index.html
